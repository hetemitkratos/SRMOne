# Render Blueprint — deploys both backends as Docker web services
# https://render.com/docs/blueprint-spec
#
# ⚠️ FREE TIER LIMIT: 750 hours/month total (not per service).
# Two services running 24/7 = ~1,440 hours → exceeds free tier.
#
# ✅ KEEP-ALIVE: A Vercel Cron Job (api/ping.js) automatically pings the
# academia-backend /health endpoint every 14 minutes to keep it warm.
# The placement-backend sleeps (cold-starts ~30s when accessed).
# Total: ~720 hours/month → stays within free tier.
#
# After connecting your GitHub repo, Render will read this file and create
# both services automatically. Set the environment variables in the Render
# dashboard (or they'll be prompted from the envVarGroups below).

services:
  # ─── Academia Backend (SRM portal scraper + API) ───────────────────────────
  - type: web
    name: academia-backend
    runtime: docker
    dockerfilePath: ./academia-backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        sync: false  # Set in dashboard: https://srmone.in,https://www.srmone.in
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false  # 32+ char key for encrypting academia/SP passwords

  # ─── Placement Backend (Haveloc placement portal scraper + API) ──────────
  - type: web
    name: placement-backend
    runtime: docker
    dockerfilePath: ./placement-backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        sync: false  # Set in dashboard: https://srmone.in,https://www.srmone.in
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false  # 32-char hex key for encrypting placement passwords
