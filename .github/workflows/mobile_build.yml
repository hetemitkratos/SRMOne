name: Build SRMOne Mobile (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
    paths:
      - 'srmone_mobile/**'
      - '.github/workflows/mobile_build.yml'
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'srmone_mobile/**'
      - '.github/workflows/mobile_build.yml'
  workflow_dispatch:

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srmone_mobile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build-android:
    name: Build Android Release APK
    # Pull requests only get the checks above; builds run on main, tags and manual runs.
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srmone_mobile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The release key lives in repository secrets. Version tags must be signed
      # with it so each release installs over the last one; other builds fall
      # back to the debug key when the secrets are missing.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "::warning::No release signing secrets; this APK is debug-signed and can't update an installed app."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # One APK for every real Android phone (32- and 64-bit ARM); x86_64 is emulator-only.
      - name: Build Android APK
        run: |
          # The run number always grows, so each build is an upgrade of the last.
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-number ${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SRMOne.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SRMOne-Android-APK
          path: srmone_mobile/build/app/outputs/flutter-apk/SRMOne.apk

  build-ios:
    name: Build iOS IPA (macOS Cloud Runner)
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: macos-14
    defaults:
      run:
        working-directory: srmone_mobile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned .ipa for Sideloadly / AltStore
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -y SRMOne-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRMOne-iOS-IPA
          path: srmone_mobile/build/ios/iphoneos/SRMOne-iOS-Unsigned.ipa

  release:
    name: Publish GitHub Release
    # Only version tags (e.g. v1.0.0) publish a release; branch pushes just keep Actions artifacts.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build-android.result == 'success'
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach APK / IPA
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SRMOne.apk
            dist/SRMOne-iOS-Unsigned.ipa
          body: |
            ## Download

            **Android:** download **SRMOne.apk** below, open it on your phone and allow installing from this source if asked.

            **iPhone:** download **SRMOne-iOS-Unsigned.ipa** and install it with Sideloadly or AltStore (it is not on the App Store).
          generate_release_notes: true
          fail_on_unmatched_files: false
