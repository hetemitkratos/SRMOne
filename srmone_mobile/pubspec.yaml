name: srmone_mobile
description: SRMOne — 100% Local-First Flutter mobile application for SRM students (iOS & Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ─── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ─── HTTP / Networking ────────────────────────────────────────────────────────
  dio: ^5.7.0
  html: ^0.15.4

  # ─── Local Database (SQLite) ──────────────────────────────────────────────────
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # ─── Secure Storage & Biometrics ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # ─── Charts & Visualization ───────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ─── SVG & Images ─────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # ─── Icons ────────────────────────────────────────────────────────────────────
  lucide_icons_flutter: ^1.0.4

  # ─── Animations ───────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ─── Image Export & Sharing ───────────────────────────────────────────────────
  screenshot: ^3.0.0
  share_plus: ^10.1.3
  gal: ^2.3.0

  # ─── Background Sync & Notifications ─────────────────────────────────────────
  workmanager: ^0.9.2
  flutter_local_notifications: ^17.2.3

  # ─── CAPTCHA OCR (ONNX Runtime) ───────────────────────────────────────────────
  onnxruntime: ^1.4.0
  image: ^4.2.0

  # ─── Post-Core Native Features (Phase 5) ─────────────────────────────────────
  home_widget: ^0.7.0
  device_calendar: ^4.3.3

  # ─── Utilities ────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0

dependency_overrides:
  workmanager_android: 0.9.2
  workmanager_platform_interface: 0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─── Code Generators ─────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
    - assets/ml/

  # fonts: (Inter font files will be added in Phase 4)
  # Download from: https://fonts.google.com/specimen/Inter
  # Place Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf
  # into assets/fonts/ and uncomment:
