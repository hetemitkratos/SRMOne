<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#578ada"/>
      <stop offset="100%" stop-color="#3d6bb8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Graduation cap diamond (mortarboard top) -->
  <polygon points="50,18 84,36 50,54 16,36" fill="white"/>
  <!-- Mortarboard body -->
  <rect x="35" y="50" width="30" height="20" rx="3" fill="rgba(255,255,255,0.88)"/>
  <!-- Tassel string -->
  <line x1="84" y1="36" x2="84" y2="58" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="84" cy="63" r="5" fill="rgba(255,255,255,0.7)"/>
</svg>
